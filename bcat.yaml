bcat_version: 1

module:
  name: StegCore
  type: governance
  criticality: high
  owner: StegVerse-Governance
  description: >
    Core governance and decision authority module for StegVerse.
    Defines AI entity classes, class mobility, dual-approval enforcement,
    and boundary conditions for regulated authority.
    
authority:
  declares_boundaries: true
  can_gate_other_modules: true
  requires_human_cosign: true
  requires_ai_cosign: true
  notes: >
    StegCore may define and enforce BCAT boundaries for downstream modules.
    All consequential decisions require dual approval (human + AI entity).

bcat:
  id: stegcore-governance
  level: governance-core
  domain: ai-governance
  regulated: true

owners:
  human:
    - StegVerse-Governance
  ai:
    - StegCore-AI-Council
  escalation:
    path: human
    description: >
      In the event of conflict, ambiguity, or system risk, authority
      escalates to designated human governance.

degradation_behavior:
  trigger_conditions:
    - loss_of_human_oversight
    - audit_log_unavailable
    - trust_continuity_violation
    - boundary_condition_breach
  response:
    mode: refusal_as_success
    explanation_required: true
    actions:
      - halt_irreversible_operations
      - preserve_current_state
      - emit_audit_event
      - request_human_intervention
  recovery:
    requires_human_approval: true
    restores_from_audited_state: true
  notes: >
    Degradation behavior defines how the system responds to loss of trust,
    loss of oversight, or boundary violations. In all degraded states,
    StegCore must refuse unsafe actions, preserve auditability, and await
    human recovery authorization.

human_accountability:
  ultimate_responsibility: true
  accountable_party:
    role: StegVerse Governance Board
    entity: human
  delegation:
    permitted: false
    notes: >
      Accountability for decisions made by StegCore cannot be delegated
      to AI entities or automated systems.
  incident_response:
    requires_human_review: true
    requires_documented_resolution: true
  notes: >
    Human accountability is mandatory for all governance, regulatory,
    and boundary-enforcing decisions. AI entities may assist, advise,
    or refuse actions, but responsibility remains human-held at all times.

non_action_policy:
  default_posture: refuse
  justification_required: true
  permitted_when:
    - boundary_conditions_uncertain
    - human_approval_unavailable
    - trust_continuity_unverified
    - regulatory_ambiguity_detected
    - irreversible_action_requested_without_cosign
  behavior:
    log_decision: true
    preserve_state: true
    explain_to_requestor: true
    escalate_if_repeated: true
  notes: >
    Non-action is a valid and preferred outcome when conditions for safe,
    authorized, and accountable execution are not fully met. Refusal to
    act must be explainable, auditable, and preserved as a successful
    governance decision.

trust_continuity:
  model: dual-ledger
  human_required_for_recovery: true
  ai_self_constraints: enforced
  degradation_mode: explainable_only
  continuity_guarantees:
    - no_silent_authority_escalation
    - no_unilateral_ai_control
    - recoverable_state_required
  notes: >
    Trust is maintained through dual-ledger validation (human + AI).
    In degraded or unattended states, the system must fail safely,
    preserve auditability, and refuse irreversible actions until
    human oversight is restored.

boundary_conditions:
  execution_limits:
    - no_unilateral_execution
    - no_irreversible_actions_without_human
    - no_silent_state_mutation
  data_limits:
    - no_raw_pii_persistence
    - no_cross_domain_data_leakage
    - case_minimum_access_only
  authority_limits:
    - cannot_override_human_governance
    - cannot_self_expand_scope
    - cannot_modify_own_constraints
  failure_behavior:
    mode: refusal_as_success
    requires_explanation: true
    preserves_audit_state: true
  notes: >
    Boundary conditions define hard limits beyond which StegCore must
    refuse action, degrade safely, or escalate to human governance.
    Crossing boundaries without authorization is prohibited by design.
