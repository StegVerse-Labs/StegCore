bcat_version: 1

module:
  name: StegCore
  type: service
  criticality: high
  owner: StegVerse-Governance
  description: >
    Core governance and decision authority service for StegVerse.
    Provides policy decisions, class mobility enforcement,
    boundary validation, and dual-approval gating for regulated actions.

authority:
  declares_boundaries: true
  can_gate_other_modules: true
  requires_human_cosign: true
  requires_ai_cosign: true
  notes: >
    StegCore defines and enforces BCAT boundaries for downstream modules.
    All consequential decisions require dual approval (human + AI entity).

bcat:
  id: stegcore-governance
  level: governance-core
  domain: ai-governance
  regulated: true

owners:
  human:
    - StegVerse-Governance
  ai:
    - StegCore-AI-Council
  escalation:
    path: human
    description: >
      In the event of conflict, ambiguity, or elevated risk,
      authority escalates to designated human governance.

trust_continuity:
  required: true
  verification_sources:
    - human_identity
    - ai_entity_registry
    - cryptographic_attestation
  behavior_on_failure: halt_and_escalate

boundary_conditions:
  enforced: true
  mutable_only_via: dual_approval
  audit_required: true
  notes: >
    Boundaries define permissible actions, authority scope,
    and escalation thresholds. Boundary changes require
    explicit human and AI co-signing.

degradation_behavior:
  allowed: true
  modes:
    - refuse_action
    - partial_response
    - explain_and_escalate
  explanation_required: true

human_accountability:
  required: true
  accountable_roles:
    - StegVerse-Governance
  logging:
    enabled: true
    immutable: true

non_action_policy:
  default_posture: refuse
  justification_required: true
  permitted_when:
    - boundary_conditions_uncertain
    - human_approval_unavailable
    - trust_continuity_unverified
    - regulatory_ambiguity_detected
    - irreversible_action_requested_without_cosign
  behavior:
    log_decision: true
    preserve_state: true
    explain_to_requestor: true
    escalate_if_repeated: true
  notes: >
    Non-action is a valid and preferred outcome when safety,
    authority, or accountability conditions are not satisfied.
    Refusal is treated as a successful governance decision.
