version: 1

bcat:
  level: governance-core
  domain: ai-governance
  regulated: true

scope:
  description: >
    StegCore defines governance, decision authority, AI entity classes,
    class mobility, and dual-approval enforcement across StegVerse.
  affects:
    - ai_entities
    - governance
    - compliance
    - class_mobility

requirements:
  human_cosign_required: true
  ai_entity_ack_required: true
  immutable_audit_log: true

constraints:
  prohibits:
    - unilateral_ai_execution
    - unlogged_class_transition
    - class_i_to_class_iii_direct

compliance:
  aligned_with:
    - CFR_38
    - Privacy_Act_1974
    - FISMA
    - StegVerse_Ethics_Constitution

owners:
  human_guardian: StegVerse-Governance
  ai_council: advisory
