bcat_version: 1

module:
  name: StegCore
  owner: StegVerse-Governance
  type: service

authority:
  source: stegcovenant
  scope:
    - governance
    - policy_decision
    - boundary_enforcement
    - class_mobility
    - dual_approval_gating
  renewal_required: true

trust_continuity:
  assumptions:
    - Human governance identities are verifiable.
    - AI entities used for co-signing are registered and auditable.
    - Repo state and CI results are the canonical reference for declared policy.
  continuity_signals:
    - Passing BCAT Gate on main
    - Valid AI entity registry entries
    - Audit log continuity preserved across releases
  break_conditions:
    - Human oversight unavailable beyond policy threshold
    - Audit log unavailable or tampered
    - Boundary definition missing or inconsistent
    - Unregistered or impersonated co-signing entity detected

boundary_conditions:
  operational:
    - No irreversible actions are authorized by StegCore alone.
    - No unilateral execution; decisions must be dual-approved where required.
    - No storage of raw PII as part of governance decisions.
  temporal:
    - Authority must be renewed on governance cadence; expired authority halts action.
    - If trust signals are stale, system must refuse and escalate.
    - Any policy change requires review before becoming effective.
  contextual:
    - If regulatory ambiguity exists, refuse and escalate to human custodian.
    - If requested action exceeds declared scope, refuse and log.
    - If downstream module BCAT is missing, gate it closed.

degradation_behavior:
  modes:
    - constrain
    - refuse
  explanation_required: true

human_accountability:
  custodian: StegVerse-Governance
  escalation_path: human

non_action_policy:
  refusal_is_success: true
  explanation_required: true
