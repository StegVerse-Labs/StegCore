name: No Required Hosted StegGate Carrier

on:
  pull_request:
    paths:
      - '.github/workflows/steggate-heartbeat-worker-reusable.yml'
      - '.github/workflows/steggate-fallback-public-runtime.yml'
      - 'scripts/check_no_required_hosted_steggate_carrier.py'
      - '.github/workflows/no-required-hosted-steggate-carrier.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/steggate-heartbeat-worker-reusable.yml'
      - '.github/workflows/steggate-fallback-public-runtime.yml'
      - 'scripts/check_no_required_hosted_steggate_carrier.py'
      - '.github/workflows/no-required-hosted-steggate-carrier.yml'
  workflow_dispatch:

# GitHub is used here only as a read-only CI validation fallback for a private
# repository. This permission cannot launch, route, activate, mutate, or own
# the canonical StegGate runtime.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no required hosted StegGate carrier
        run: python3 scripts/check_no_required_hosted_steggate_carrier.py
      - name: Confirm validation-only boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/no-required-hosted-steggate-carrier.yml').read_text(encoding='utf-8')
          forbidden = (
              'contents: ' + 'write',
              'issues: ' + 'write',
              'pull-requests: ' + 'write',
              'repository_' + 'dispatch:',
              'git ' + 'push',
              'gh ' + 'api',
              'upload-' + 'artifact@',
          )
          assert 'contents: read' in text
          assert 'persist-credentials: false' in text
          assert all(marker not in text for marker in forbidden), forbidden
          print('HOSTED_CARRIER_VALIDATION_ROLE=READ_ONLY_CI_FALLBACK')
          print('HOSTED_CARRIER_RUNTIME_AUTHORITY=NONE')
          PY
