name: Neural Micro-Node Governance

on:
  push:
    paths:
      - 'src/stegcore/neural_micronode.py'
      - 'tests/test_neural_micronode.py'
      - 'schemas/neural-micronode-packet.schema.json'
      - 'docs/NEURAL_MICRONODE_GOVERNANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/neural-micronode.yml'
  pull_request:
    paths:
      - 'src/stegcore/neural_micronode.py'
      - 'tests/test_neural_micronode.py'
      - 'schemas/neural-micronode-packet.schema.json'
      - '.github/workflows/neural-micronode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate packet schema syntax
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from stegcore._vendor import structural_validator as sv
          with open('schemas/neural-micronode-packet.schema.json', encoding='utf-8') as f:
              schema = json.load(f)
          digest = hashlib.sha256(sv.canonical_bytes(schema)).hexdigest()
          admitted = sv.check_schema(schema, digest)
          if not admitted['valid']:
              print(json.dumps({'disposition': 'FAIL_CLOSED', 'errors': admitted['errors'], 'authority_effect': 'NONE'}, sort_keys=True))
              sys.exit(1)
          print('schema valid (vendored structural validator, contract ' + sv.CONTRACT['contract_version'] + ')')
          PY
      - name: Run neural micro-node tests
        run: pytest -q tests/test_neural_micronode.py
      - name: Verify authority-boundary literals
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/stegcore/neural_micronode.py').read_text()
          for required in ('AUTHORIZATION_UNESTABLISHED', 'TRANSLATION_PROVENANCE_INCOMPLETE', 'DESTINATION_AMBIGUOUS'):
              assert required in text, required
          print('authority boundary present')
          PY
