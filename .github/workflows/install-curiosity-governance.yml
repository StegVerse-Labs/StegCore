name: Install curiosity motive governance

on:
  push:
    branches:
      - feat/curiosity-affective-governance-v6
    paths:
      - "bootstrap/curiosity-governance-v1.tar.gz.b64"
      - "bootstrap/install_curiosity_governance.py"
      - ".github/workflows/install-curiosity-governance.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract governed implementation
        run: python bootstrap/install_curiosity_governance.py
      - name: Install and verify
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_motive_governance.py
      - name: Commit implementation
        run: |
          git config user.name "stegverse-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Install replayable curiosity motive governance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
