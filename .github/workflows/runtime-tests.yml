name: Validate StegCore Runtime

on:
  push:
    branches:
      - main
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate continuity admissibility mapping
        run: python scripts/check_continuity_admissibility_mapping.py docs/CONTINUITY_ADMISSIBILITY_RECEIPT_MAPPING.md

      - name: Run runtime tests
        run: pytest -q
