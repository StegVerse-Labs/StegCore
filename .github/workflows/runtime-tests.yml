name: Validate StegCore Runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evidence/downstream-verification-dispatch.json'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evidence/downstream-verification-dispatch.json'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: stegcore-runtime-validation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out StegCore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate local runtime contract
        run: |
          python scripts/check_continuity_admissibility_mapping.py docs/CONTINUITY_ADMISSIBILITY_RECEIPT_MAPPING.md
          python scripts/check_downstream_verification_dispatch.py evidence/downstream-verification-dispatch.json
          pytest -q

      - name: Acquire canonical Governance contract
        id: governance
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: StegVerse-Labs/Governance
          ref: main
          token: ${{ secrets.STEGVERSE_CROSS_REPO_TOKEN || github.token }}
          path: _governance
          fetch-depth: 1

      - name: Record Governance acquisition state
        id: acquisition
        run: |
          mkdir -p evidence
          if [ '${{ steps.governance.outcome }}' = 'success' ]; then
            STATE=acquired
            SHA="$(git -C _governance rev-parse HEAD)"
          else
            STATE=blocked_cross_repository_access
            SHA=null
          fi
          python - "$STATE" "$SHA" <<'PY'
          import json, sys
          from pathlib import Path
          state, sha = sys.argv[1:]
          record = {
              'schema_version': '1.0.0',
              'state': state,
              'governance_commit': None if sha == 'null' else sha,
              'manual_action_required': False,
              'release_authority': False,
              'production_authority': False,
              'receipt_minting_authority': False,
          }
          Path('evidence/governance-contract-acquisition.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Verify Governance fixtures through StegCore
        if: steps.acquisition.outputs.state == 'acquired'
        run: python scripts/verify_governance_three_layer_contract.py _governance

      - name: Reconcile cross-repository access issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ACQUISITION_STATE: ${{ steps.acquisition.outputs.state }}
        run: |
          TITLE='[automation] Governance contract acquisition blocked'
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ "$ACQUISITION_STATE" = acquired ]; then
            [ -z "$NUMBER" ] || gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Cross-repository acquisition recovered automatically.'
          else
            BODY='StegCore local runtime validation passed, but the Governance contract could not be acquired. State is recorded in evidence/governance-contract-acquisition.json. Resolution is machine-owned through repository credentials or a later successful run. No manual copying is required and no release authority is granted.'
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
              gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
          fi

      - name: Persist acquisition state on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'stegcore-validation-bot'
          git config user.email 'stegcore-validation-bot@users.noreply.github.com'
          git add evidence/governance-contract-acquisition.json
          git diff --cached --quiet || git commit -m 'Record Governance acquisition state [skip ci]'
          git push origin HEAD:main
