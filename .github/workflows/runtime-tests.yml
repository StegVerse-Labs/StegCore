name: Validate StegCore Runtime

on:
  push:
    branches:
      - main
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'contracts/governance_snapshot/**'
      - 'evidence/downstream-verification-dispatch.json'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'contracts/governance_snapshot/**'
      - 'evidence/downstream-verification-dispatch.json'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: stegcore-runtime-validation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out StegCore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate continuity admissibility mapping
        run: python scripts/check_continuity_admissibility_mapping.py docs/CONTINUITY_ADMISSIBILITY_RECEIPT_MAPPING.md

      - name: Validate downstream verification dispatch
        run: python scripts/check_downstream_verification_dispatch.py evidence/downstream-verification-dispatch.json

      - name: Run runtime tests
        run: pytest -q

      - name: Validate pinned Governance snapshot manifest
        id: governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('contracts/governance_snapshot/manifest.json').read_text())
          assert manifest['source_repository'] == 'StegVerse-Labs/Governance'
          assert len(manifest['source_commit']) == 40
          assert manifest['authoritative_status'] == 'evidence_snapshot_not_governance_authority'
          assert manifest['refresh_required_before_release'] is True
          for item in manifest['fixtures']:
              path = Path('contracts/governance_snapshot') / item['path']
              assert path.is_file(), path
              assert len(item['source_blob_sha']) == 40
          with open(Path('${{ runner.temp }}') / 'governance_sha', 'w') as handle:
              handle.write(manifest['source_commit'])
          PY
          echo "governance_sha=$(cat '${{ runner.temp }}/governance_sha')" >> "$GITHUB_OUTPUT"

      - name: Verify Governance three-layer snapshot through StegCore
        run: python scripts/verify_governance_three_layer_contract.py contracts/governance_snapshot

      - name: Record passing validation and release-readiness evidence
        id: evidence
        if: github.event_name != 'pull_request'
        env:
          GOVERNANCE_SHA: ${{ steps.governance.outputs.governance_sha }}
        run: |
          BEFORE="$(cat evidence/runtime-validation.json evidence/release-readiness.json 2>/dev/null | sha256sum | awk '{print $1}' || true)"
          CONTRACT_SHA="$(git rev-list -1 HEAD -- src/stegcore tests scripts docs contracts/governance_snapshot evidence/downstream-verification-dispatch.json pyproject.toml .github/workflows/runtime-tests.yml)"
          python scripts/record_runtime_validation.py \
            --output evidence/runtime-validation.json \
            --dispatch evidence/downstream-verification-dispatch.json \
            --stegcore-commit "$CONTRACT_SHA" \
            --governance-commit "$GOVERNANCE_SHA" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --event "${GITHUB_EVENT_NAME}" \
            --issue 22
          python scripts/check_runtime_validation_evidence.py evidence/runtime-validation.json
          python scripts/assess_release_readiness.py \
            --evidence evidence/runtime-validation.json \
            --output evidence/release-readiness.json
          AFTER="$(cat evidence/runtime-validation.json evidence/release-readiness.json | sha256sum | awk '{print $1}')"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "contract_sha=$CONTRACT_SHA" >> "$GITHUB_OUTPUT"
          echo "governance_sha=$GOVERNANCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Commit durable validation evidence
        if: github.event_name != 'pull_request' && steps.evidence.outputs.changed == 'true'
        run: |
          git config user.name "stegcore-validation-bot"
          git config user.email "stegcore-validation-bot@users.noreply.github.com"
          git add evidence/runtime-validation.json evidence/release-readiness.json
          git commit -m "Record StegCore validation and release-readiness state [skip ci]"
          git push origin HEAD:main

      - name: Reconcile implementation and release-readiness issues
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_SHA: ${{ steps.evidence.outputs.contract_sha }}
          GOVERNANCE_SHA: ${{ steps.evidence.outputs.governance_sha }}
        run: |
          IMPLEMENTATION_STATE="$(gh issue view 22 --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          COMPLETION_COMMENT="Automated validation passed for StegCore contract commit ${CONTRACT_SHA} against pinned Governance evidence commit ${GOVERNANCE_SHA}. Durable evidence: evidence/runtime-validation.json. Release state: evidence/release-readiness.json. Downstream dispatch: evidence/downstream-verification-dispatch.json. Governance freshness remains required before release. This establishes validated_not_released only."
          if [ "$IMPLEMENTATION_STATE" = "OPEN" ]; then
            gh issue close 22 --repo "$GITHUB_REPOSITORY" --reason completed --comment "$COMPLETION_COMMENT"
          fi

          FAILURE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "StegCore runtime validation failure in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$FAILURE_NUMBER" ]; then
            gh issue close "$FAILURE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Automatic runtime validation recovered. Passing evidence is recorded under evidence/."
          fi

          READINESS_TITLE="[release-readiness] StegCore three-layer candidate"
          READINESS_BODY=$(cat <<EOF
          ## State

          validated_not_released

          ## Durable records

          - evidence/runtime-validation.json
          - evidence/release-readiness.json
          - evidence/downstream-verification-dispatch.json
          - contracts/governance_snapshot/manifest.json
          - StegCore contract commit: ${CONTRACT_SHA}
          - pinned Governance evidence commit: ${GOVERNANCE_SHA}

          Governance freshness must be independently confirmed before release. Release and tagging remain blocked until independent release policy and all four downstream verification gates are durably recorded as pass.

          Downstream verification is queued in Site #14, Publisher #4, admissibility-wiki #19, and StegGuardian Wiki #4.

          This issue does not grant release, production, continuity, deployment, cross-repository mutation, or receipt-minting authority.
          EOF
          )
          READINESS_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "StegCore three-layer candidate in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$READINESS_NUMBER" ]; then
            gh issue edit "$READINESS_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$READINESS_BODY"
            gh issue reopen "$READINESS_NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$READINESS_TITLE" --body "$READINESS_BODY"
          fi

      - name: Reconcile validation failure issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[automation] StegCore runtime validation failure"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Automatic StegCore runtime validation failed.

          - Commit: ${GITHUB_SHA}
          - Event: ${GITHUB_EVENT_NAME}
          - Run: ${RUN_URL}

          Resolution is owned by repository automation and the next corrective commit. A later successful run closes this issue automatically.
          EOF
          )
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "StegCore runtime validation failure in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
