name: Validate StegCore Runtime - No Non-TV/TVC Credential Authority

on:
  push:
    branches:
      - main
    paths:
      - 'src/stegcore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'spec/**'
      - 'examples/originating-choice*.json'
      - 'docs/**'
      - 'ecosystem_management/tidc_evidence_chain_registry.json'
      - 'ecosystem_management/correctability_layer.v0.1.json'
      - 'ecosystem_management/correctability_claim.v0.1.json'
      - 'contracts/criterion-contestability-boundary.v1.json'
      - 'contracts/permission-admissibility-boundary.v1.json'
      - 'contracts/governance_snapshot/**'
      - 'evidence/downstream-verification-dispatch.json'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: stegcore-runtime-validation
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert credential-clean validation environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo "credential_authority=TV/TVC"
          echo "consumer_credential_present=false"
      - name: Anonymous public repository fetch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then SOURCE_REF="refs/pull/${PR_NUMBER}/merge"; else SOURCE_REF="${GITHUB_SHA}"; fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Verify preinstalled Python
        run: python3 --version
      - name: Install package and test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . pytest
      - name: Validate no non-TV/TVC validation credential path
        run: python3 scripts/validate_no_non_tvtvc_validation_credentials.py
      - name: Validate continuity admissibility mapping
        run: python3 scripts/check_continuity_admissibility_mapping.py docs/CONTINUITY_ADMISSIBILITY_RECEIPT_MAPPING.md
      - name: Validate downstream verification dispatch
        run: python3 scripts/check_downstream_verification_dispatch.py evidence/downstream-verification-dispatch.json
      - name: Validate consolidated TIDC evidence-chain management
        run: |
          python3 -m py_compile scripts/check_tidc_evidence_chain_management.py
          python3 scripts/check_tidc_evidence_chain_management.py
      - name: Validate consolidated criterion contestability boundary
        run: python3 scripts/validate_criterion_contestability_boundary.py
      - name: Validate consolidated permission admissibility boundary
        run: |
          python3 scripts/validate_permission_admissibility_boundary.py
          python3 -m pytest -q tests/test_permission_admissibility_boundary.py
          echo 'PERMISSION_ADMISSIBILITY_TESTS=PASS'
      - name: Validate consolidated correctability layer
        run: |
          python3 tools/verify_correctability_layer.py
          test -f brain_reports/correctability_layer_report.json
          sha256sum brain_reports/correctability_layer_report.json
      - name: Validate consolidated governed runtime adapter conformance
        run: |
          python3 -m py_compile src/stegcore/runtime.py src/stegcore/runtime_adapters.py
          python3 -m pytest -q tests/test_runtime_commit_coherence.py tests/test_governed_runtime_adapters.py tests/test_governed_runtime_reconciliation.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/stegcore/runtime_adapters.py').read_text(encoding='utf-8')
          assert 'governed_execute(' in source
          assert 'executor()' not in source
          print('ADAPTER_BYPASS_STATIC_GUARD_PASS')
          PY
      - name: Validate consolidated originating-choice contract and routing
        run: |
          mkdir -p artifacts/originating-choice
          python3 tools/validate_originating_choice.py spec/originating-choice.schema.json examples/originating-choice.valid.json --receipt-output artifacts/originating-choice/validation-receipt.json
          python3 tools/validate_originating_choice.py --self-test --receipt-output artifacts/originating-choice/self-test-receipt.json
          python3 tools/consume_originating_choice.py spec/originating-choice.schema.json examples/originating-choice.valid.json --output artifacts/originating-choice/integration-receipt.json
          python3 tools/consume_originating_choice.py --self-test --output artifacts/originating-choice/integration-self-test-receipt.json
          sha256sum artifacts/originating-choice/*.json
      - name: Run runtime tests
        run: python3 -m pytest -q
      - name: Validate pinned Governance snapshot manifest
        id: governance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('contracts/governance_snapshot/manifest.json').read_text())
          assert manifest['source_repository'] == 'StegVerse-Labs/Governance'
          assert len(manifest['source_commit']) == 40
          assert manifest['authoritative_status'] == 'evidence_snapshot_not_governance_authority'
          assert manifest['refresh_required_before_release'] is True
          for item in manifest['fixtures']:
              path = Path('contracts/governance_snapshot') / item['path']
              assert path.is_file(), path
              assert len(item['source_blob_sha']) == 40
          with open(Path('${{ runner.temp }}') / 'governance_sha', 'w') as handle:
              handle.write(manifest['source_commit'])
          PY
          echo "governance_sha=$(cat '${{ runner.temp }}/governance_sha')" >> "$GITHUB_OUTPUT"
      - name: Verify Governance three-layer snapshot through StegCore
        run: python3 scripts/verify_governance_three_layer_contract.py contracts/governance_snapshot
      - name: Generate non-persistent validation and release-readiness evidence
        id: evidence
        if: github.event_name != 'pull_request'
        env:
          GOVERNANCE_SHA: ${{ steps.governance.outputs.governance_sha }}
        run: |
          CONTRACT_SHA="$(git rev-list -1 HEAD -- src/stegcore tests scripts tools spec examples docs ecosystem_management/tidc_evidence_chain_registry.json ecosystem_management/correctability_layer.v0.1.json ecosystem_management/correctability_claim.v0.1.json contracts/criterion-contestability-boundary.v1.json contracts/permission-admissibility-boundary.v1.json contracts/governance_snapshot evidence/downstream-verification-dispatch.json pyproject.toml .github/workflows/runtime-tests.yml)"
          python3 scripts/record_runtime_validation.py --output evidence/runtime-validation.json --dispatch evidence/downstream-verification-dispatch.json --stegcore-commit "$CONTRACT_SHA" --governance-commit "$GOVERNANCE_SHA" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --workflow "${GITHUB_WORKFLOW}" --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" --event "${GITHUB_EVENT_NAME}" --issue 22
          python3 scripts/check_runtime_validation_evidence.py evidence/runtime-validation.json
          python3 scripts/assess_release_readiness.py --evidence evidence/runtime-validation.json --output evidence/release-readiness.json
          sha256sum evidence/runtime-validation.json evidence/release-readiness.json
          echo "contract_sha=$CONTRACT_SHA" >> "$GITHUB_OUTPUT"
          echo "persistence_authority=TV/TVC_ONLY_NOT_THIS_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated validation evidence is ephemeral in this credential-clean workflow; durable repository persistence is delegated to the separately governed TV/TVC repository-operation path." >> "$GITHUB_STEP_SUMMARY"
