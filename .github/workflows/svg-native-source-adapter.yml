name: SVG native source adapter
on:
  pull_request:
    paths:
      - 'benchmarks/svg_native_source_adapter.py'
      - 'tests/test_svg_native_source_adapter.py'
      - '.github/workflows/svg-native-source-adapter.yml'
  workflow_dispatch:
jobs:
  native-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install StegCore
        run: python -m pip install -e .
      - name: Test native source adapter
        run: python -m unittest discover -s tests -p test_svg_native_source_adapter.py -v
