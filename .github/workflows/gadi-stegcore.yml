name: GADI StegCore Validation

on:
  pull_request:
    paths:
      - 'GADI_STEGCORE_MIRROR_HANDOFF.md'
      - 'src/stegcore/gadi_defense_planner.py'
      - 'tests/test_gadi_defense_planner.py'
      - '.github/workflows/gadi-stegcore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run focused GADI tests
        run: pytest -q tests/test_gadi_defense_planner.py

      - name: Compile GADI planner
        run: python -m py_compile src/stegcore/gadi_defense_planner.py
