name: SDK Evaluator Source Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/sdk-evaluator-source-snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack exact source snapshot
        run: |
          tar --exclude=.git -czf /tmp/source-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-evaluator-source-snapshot
          path: /tmp/source-snapshot.tgz
