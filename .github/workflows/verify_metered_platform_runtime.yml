name: Verify Metered Platform Runtime

on:
  push:
    paths:
      - "src/stegcore/metered_platform.py"
      - "tests/test_metered_platform.py"
      - "scripts/write_metered_platform_runtime_evidence.py"
      - ".github/workflows/verify_metered_platform_runtime.yml"
  pull_request:
    paths:
      - "src/stegcore/metered_platform.py"
      - "tests/test_metered_platform.py"
      - "scripts/write_metered_platform_runtime_evidence.py"
      - ".github/workflows/verify_metered_platform_runtime.yml"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_metered_platform.py
      - run: python scripts/write_metered_platform_runtime_evidence.py
      - name: Verify deterministic evidence
        run: |
          cp evidence/metered-platform-runtime-validation.json /tmp/evidence.json
          python scripts/write_metered_platform_runtime_evidence.py
          cmp evidence/metered-platform-runtime-validation.json /tmp/evidence.json
      - name: Persist evidence on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "stegverse-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/metered-platform-runtime-validation.json
          git diff --cached --quiet || git commit -m "Update metered platform runtime evidence"
          git push
