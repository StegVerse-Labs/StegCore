name: Portable Release Candidate - Build Only / TV-TVC Publication Authority

on:
  pull_request:
    paths:
      - 'sdk/portable_release_manifest.v1.json'
      - 'sdk/portable_package_catalog.v1.json'
      - 'tools/build_portable_ecosystem_package.py'
      - 'tools/prepare_portable_release.py'
      - 'micro_ecosystem/**'
      - 'src/stegcore/**'
      - 'pyproject.toml'
      - 'tests/test_portable_release_factory.py'
      - '.github/workflows/portable-release-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/portable_release_manifest.v1.json'
      - 'sdk/portable_package_catalog.v1.json'
      - 'tools/build_portable_ecosystem_package.py'
      - 'micro_ecosystem/**'
      - 'src/stegcore/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions: {}

jobs:
  prepare-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Assert no publication credential authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${TVC_EPHEMERAL_GITHUB_TOKEN:-}"

      - name: Materialize exact public source anonymously
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/StegCore.git
          if [ "$EVENT_NAME" = "pull_request" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "$SOURCE_SHA"
          fi
          git checkout --detach FETCH_HEAD

      - name: Install test dependency
        shell: bash
        run: python -m pip install pytest

      - name: Validate release factory
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_portable_ecosystem_package.py tests/test_portable_release_factory.py -q

      - name: Prepare S and NS release assets
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_portable_release.py --output-dir dist/portable-release
          test -f dist/portable-release/PORTABLE_RELEASE_RECEIPT.json
          test -f dist/portable-release/SHA256SUMS
          test "$(find dist/portable-release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 4

      - name: Prove publication remains TV/TVC-gated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('dist/portable-release/PORTABLE_RELEASE_RECEIPT.json').read_text())
          assert receipt['release_publication_state'] == 'CANDIDATE_NOT_PUBLISHED'
          assert receipt['publication_authority'] == 'TV/TVC'
          assert receipt['github_build_is_runtime_authority'] is False
          assert receipt['github_release_is_execution_authority'] is False
          PY
