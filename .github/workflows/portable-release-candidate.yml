name: Portable Release Candidate - Build Only / TV-TVC Publication Authority

on:
  pull_request:
    branches-ignore:
      - feat/ae-manifest-capability-context-v1
    paths:
      - 'sdk/portable_release_manifest.v1.json'
      - 'sdk/portable_package_catalog.v1.json'
      - 'tools/build_portable_ecosystem_package.py'
      - 'tools/prepare_portable_release.py'
      - 'micro_ecosystem/**'
      - 'src/stegcore/**'
      - 'pyproject.toml'
      - 'tests/test_portable_release_factory.py'
      - '.github/workflows/portable-release-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/portable_release_manifest.v1.json'
      - 'sdk/portable_package_catalog.v1.json'
      - 'tools/build_portable_ecosystem_package.py'
      - 'tools/prepare_portable_release.py'
      - 'micro_ecosystem/**'
      - 'src/stegcore/**'
      - 'pyproject.toml'
      - '.github/workflows/portable-release-candidate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  prepare-release-candidate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert no publication credential authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${TVC_EPHEMERAL_GITHUB_TOKEN:-}"
      - name: Materialize exact public source anonymously
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/StegCore.git
          if [ "$EVENT_NAME" = "pull_request" ]; then env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"; else env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "$SOURCE_SHA"; fi
          git checkout --detach FETCH_HEAD
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate release factory
        run: python -m pytest tests/test_portable_ecosystem_package.py tests/test_portable_release_factory.py -q
      - name: Prepare S and NS release assets
        run: |
          set -euo pipefail
          python tools/prepare_portable_release.py --output-dir dist/portable-release
          test -f dist/portable-release/PORTABLE_RELEASE_RECEIPT.json
          test -f dist/portable-release/SHA256SUMS
          test "$(find dist/portable-release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 4
      - name: Resolve immutable candidate artifact identity
        id: candidate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          receipt = json.loads(Path('dist/portable-release/PORTABLE_RELEASE_RECEIPT.json').read_text())
          print(f"name=stegverse-portable-release-candidate-v{receipt['release_version']}-{receipt['source_commit']}")
          print(f"version={receipt['release_version']}")
          print(f"commit={receipt['source_commit']}")
          PY
      - name: Persist exact GitHub-built release candidate for TVC transport
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: dist/portable-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Prove candidate transport remains non-authorizing
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('dist/portable-release/PORTABLE_RELEASE_RECEIPT.json').read_text())
          assert receipt['release_publication_state'] == 'CANDIDATE_NOT_PUBLISHED'
          assert receipt['publication_authority'] == 'TV/TVC'
          assert receipt['github_build_is_runtime_authority'] is False
          assert receipt['github_release_is_execution_authority'] is False
          assert receipt['node_membership_granted'] is False
          PY
