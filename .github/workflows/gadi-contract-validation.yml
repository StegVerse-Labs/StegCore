name: GADI contract validation

on:
  push:
    branches:
      - gadi-001-stegcore-threat-reasoning
      - gadi-intr-admission-producer-001
      - gadi-local-admission-materializer-001
    paths:
      - 'src/stegcore/gadi.py'
      - 'src/stegcore/gadi_intr_admission.py'
      - 'scripts/materialize_gadi_local_admission.py'
      - 'tests/test_gadi.py'
      - 'tests/test_gadi_intr_admission.py'
      - 'tests/test_gadi_local_admission_materializer.py'
      - 'contracts/universal_governance_connector_snapshot/**'
      - 'contracts/stegos_universal_intr_snapshot/**'
      - 'docs/GADI_STEGCORE_MIRROR_HANDOFF.md'
      - '.github/workflows/gadi-contract-validation.yml'
  pull_request:
    paths:
      - 'src/stegcore/gadi.py'
      - 'src/stegcore/gadi_intr_admission.py'
      - 'scripts/materialize_gadi_local_admission.py'
      - 'tests/test_gadi.py'
      - 'tests/test_gadi_intr_admission.py'
      - 'tests/test_gadi_local_admission_materializer.py'
      - 'contracts/universal_governance_connector_snapshot/**'
      - 'contracts/stegos_universal_intr_snapshot/**'
      - 'docs/GADI_STEGCORE_MIRROR_HANDOFF.md'
      - '.github/workflows/gadi-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gadi-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install StegCore
        run: python -m pip install -e . pytest
      - name: Validate GADI reasoning and admission contracts
        run: python -m pytest -q tests/test_gadi.py tests/test_gadi_intr_admission.py tests/test_gadi_local_admission_materializer.py
      - name: Compile GADI implementation
        run: python -m py_compile src/stegcore/gadi.py src/stegcore/gadi_intr_admission.py scripts/materialize_gadi_local_admission.py
