name: Release bump (portable product)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | explicit X.Y.Z"
        required: true
        default: "patch"
        type: string
      summary:
        description: "One-line release summary"
        required: true
        default: "Describe this release"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bump all portable product version surfaces
        run: |
          set -euo pipefail
          python scripts/release/bump_version.py "${{ inputs.bump }}"
          NEW_VERSION="$(cat VERSION)"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          python scripts/release/update_changelog.py "$NEW_VERSION" "${{ inputs.summary }}"
          python scripts/verify_product_consistency.py

      - name: Install release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run release-candidate correctness and performance gates
        run: |
          pytest -q tests/test_admittedcode_performance.py
          python tools/run_admittedcode_benchmarks.py \
            --iterations 500 \
            --replay-iterations 100 \
            --throughput-requests 500 \
            --concurrency 1,10,50 \
            --output artifacts/admittedcode-performance-release-candidate.json

      - name: Upload release-candidate performance receipt
        uses: actions/upload-artifact@v4
        with:
          name: admittedcode-performance-release-candidate-${{ github.run_id }}
          path: artifacts/admittedcode-performance-release-candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Create release branch and commit
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW_VERSION}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git config user.name "stegverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION pyproject.toml src/stegcore/version.py CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"

      - name: Push release branch
        run: git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${NEW_VERSION}" \
            --body "Portable product release bump. Updates VERSION, pyproject.toml, src/stegcore/version.py, and CHANGELOG.md as one version identity. Product consistency and AdmittedCode release-blocking benchmark gates passed before this PR was opened. Required repository checks must also pass before merge." || true

      - name: Add release label when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$BRANCH" --add-label "release" || true
