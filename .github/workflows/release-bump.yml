name: Release bump (version + changelog) [PR]

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major OR explicit version X.Y.Z"
        required: true
        default: "patch"
        type: string
      summary:
        description: "One-line changelog summary"
        required: true
        default: "Describe this release"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version + update changelog
        run: |
          python scripts/release/bump_version.py "${{ inputs.bump }}"
          NEW_VERSION="$(cat VERSION)"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          python scripts/release/update_changelog.py "$NEW_VERSION" "${{ inputs.summary }}"

      - name: Create release branch + commit
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW_VERSION}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git config user.name "stegverse-bot"
          git config user.email "actions@users.noreply.github.com"

          # Create branch from the checked-out commit (main HEAD)
          git checkout -b "$BRANCH"

          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"

      - name: Push release branch
        run: |
          git push --set-upstream origin "$BRANCH"

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="chore(release): v${NEW_VERSION}"
          BODY=$(cat <<'EOF'
This PR was auto-generated by the Release bump workflow.

It updates:
- VERSION
- CHANGELOG.md

Notes:
- Branch protections require PR-based changes to main.
- Required checks (including BCAT) must pass before merge.
EOF
)
          # Create PR (idempotent-ish: if it already exists, this will fail; that's okay)
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY" || true

      - name: Add label (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # If label doesn't exist, this will fail harmlessly.
          gh pr edit "release/v${NEW_VERSION}" --add-label "release" || true
