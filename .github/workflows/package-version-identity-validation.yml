name: StegCore Package Version Identity Validation

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'tests/test_package_version_identity.py'
      - '.github/workflows/package-version-identity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credential
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pytest and build
        run: python -m pip install --disable-pip-version-check --no-input pytest build
      - name: Verify moving source identity
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: python -m pytest -q tests/test_package_version_identity.py tests/test_spe_standing_binding.py tests/test_steggate_runtime.py
      - name: Build artifact
        run: python -m build
      - name: Verify built metadata version
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              meta = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]
              text = z.read(meta).decode()
          assert 'Name: stegcore' in text
          assert 'Version: 0.3.0.dev0' in text
          print('STEGCORE_0_3_DEV_ARTIFACT_IDENTITY_PASS')
          PY
      - name: Record non-authorizing boundary
        run: |
          echo 'PACKAGE_VERSION_IDENTITY_NON_AUTHORIZING_PASS'
          echo 'This workflow grants no merge, release, tag, publication, runtime, or TV/TVC authority.'
