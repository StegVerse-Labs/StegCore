name: Validate External Evidence Interoperability

on:
  push:
    branches: [main]
    paths:
      - 'src/stegcore/external_evidence.py'
      - 'src/stegcore/three_layer.py'
      - 'tests/test_external_evidence.py'
      - 'scripts/verify_governance_external_evidence_contract.py'
      - 'contracts/governance_external_evidence_snapshot/**'
      - '.github/workflows/external-evidence-interop.yml'
      - 'docs/STEGCORE_MIRROR_HANDOFF.md'
  pull_request:
    paths:
      - 'src/stegcore/external_evidence.py'
      - 'src/stegcore/three_layer.py'
      - 'tests/test_external_evidence.py'
      - 'scripts/verify_governance_external_evidence_contract.py'
      - 'contracts/governance_external_evidence_snapshot/**'
      - '.github/workflows/external-evidence-interop.yml'
  workflow_dispatch: {}

concurrency:
  group: stegcore-external-evidence-interop
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out StegCore
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install StegCore and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate pinned Governance external-evidence snapshot
        id: governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('contracts/governance_external_evidence_snapshot')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['source_repository'] == 'StegVerse-Labs/Governance'
          assert len(manifest['source_commit']) == 40
          assert manifest['authoritative_status'] == 'evidence_snapshot_not_governance_authority'
          assert manifest['refresh_required_before_release'] is True
          assert len(manifest['fixtures']) == 5
          for item in manifest['fixtures']:
              assert (root / item['path']).is_file(), item['path']
              assert len(item['source_blob_sha']) == 40
          with open(Path('${{ runner.temp }}') / 'governance_sha', 'w') as handle:
              handle.write(manifest['source_commit'])
          PY
          echo "governance_sha=$(cat '${{ runner.temp }}/governance_sha')" >> "$GITHUB_OUTPUT"

      - name: Run complete StegCore tests
        run: pytest -q

      - name: Validate Governance interop fixtures through StegCore
        run: python scripts/verify_governance_external_evidence_contract.py contracts/governance_external_evidence_snapshot

      - name: Reconcile issue 25 on success
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_SHA: ${{ steps.governance.outputs.governance_sha }}
        run: |
          BODY="External evidence interoperability passed for StegCore ${GITHUB_SHA} against pinned Governance evidence commit ${GOVERNANCE_SHA}. All five canonical cases passed through the actual runtime; provider execution authority and Continuity receipt minting remained false. Snapshot freshness remains required before release. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "$BODY"
          STATE="$(gh issue view 25 --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [ "$STATE" = "OPEN" ]; then
            gh issue close 25 --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Record machine-observable failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="External evidence interoperability validation failed for ${GITHUB_SHA}. Machine-observable release condition: a later successful run of this workflow. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "$BODY"
