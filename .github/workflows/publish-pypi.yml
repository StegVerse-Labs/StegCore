name: Publish StegCore to PyPI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/publish-pypi.yml'
      - 'docs/STEGVERSE_STEGCORE_PYPI_DISTRIBUTION.md'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify canonical source identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          NAME="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])
          PY
          )"
          test "$NAME" = "stegcore"
          if [ "$EVENT_NAME" = "release" ]; then
            test "$RELEASE_TAG" = "v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release candidate binding
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v0.3.0"
          EXPECTED="58445bb14642c1889cf9802666c15bd48c6d2e39"
          PARENT="ef38410505b0ef3e84148892b1d6e3cdef20f300"
          ACTUAL="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$ACTUAL" = "$EXPECTED"
          test "$(git rev-parse "$EXPECTED^")" = "$PARENT"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Apply deterministic public distribution name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path('pyproject.toml')
          source = path.read_text()
          exact = 'name = "stegcore"'
          replacement = 'name = "stegverse-stegcore"'
          if source.count(exact) != 1:
              raise SystemExit('canonical_stegcore_distribution_name_not_unique')
          path.write_text(source.replace(exact, replacement, 1))
          project = tomllib.loads(path.read_text())['project']
          assert project['name'] == 'stegverse-stegcore'
          print('STEGVERSE_STEGCORE_DISTRIBUTION_RENAME_PASS')
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify complete distribution set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name 'stegverse_stegcore-*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'stegverse_stegcore-*.tar.gz' | wc -l)" -eq 1
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import stegcore
          assert importlib.metadata.version('stegverse-stegcore')
          print('STEGVERSE_STEGCORE_PUBLIC_PACKAGE_IMPORT_PASS')
          PY

      - name: Upload distributions for publish job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stegverse-stegcore/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
