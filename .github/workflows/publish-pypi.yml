name: Publish StegCore to PyPI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/publish-pypi.yml'
      - 'docs/STEGVERSE_STEGCORE_PYPI_DISTRIBUTION.md'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify canonical source identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          NAME="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])
          PY
          )"
          test "$NAME" = "stegcore"
          if [ "$EVENT_NAME" = "release" ]; then
            test "$RELEASE_TAG" = "v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release candidate binding
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The tagged release commit cannot name its own SHA, so it pins its exact
          # source parent in RELEASE_BINDING.json and may change only release-note files.
          python - <<'PY'
          import json, os, pathlib, subprocess, tomllib

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          binding = json.loads(pathlib.Path("RELEASE_BINDING.json").read_text())
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          assert binding["schema"] == "stegverse.stegcore.release-binding.v1", binding.get("schema")
          assert binding["version"] == version, (binding["version"], version)
          assert binding["tag"] == tag == f"v{version}", (binding["tag"], tag, version)
          head = git("rev-parse", "HEAD")
          assert git("rev-parse", f"refs/tags/{tag}^{{commit}}") == head, "tag does not resolve to checkout"
          parents = git("rev-list", "--parents", "-n", "1", head).split()[1:]
          assert parents == [binding["source_parent"]], (parents, binding["source_parent"])
          changed = set(git("diff", "--name-only", f"{binding['source_parent']}..{head}").splitlines())
          assert changed == set(binding["release_commit_paths"]), sorted(changed)
          print(f"IMMUTABLE_RELEASE_BINDING_PASS tag={tag} commit={head} parent={binding['source_parent']}")
          PY

      - name: Apply deterministic public distribution name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path('pyproject.toml')
          source = path.read_text()
          exact = 'name = "stegcore"'
          replacement = 'name = "stegverse-stegcore"'
          if source.count(exact) != 1:
              raise SystemExit('canonical_stegcore_distribution_name_not_unique')
          path.write_text(source.replace(exact, replacement, 1))
          project = tomllib.loads(path.read_text())['project']
          assert project['name'] == 'stegverse-stegcore'
          print('STEGVERSE_STEGCORE_DISTRIBUTION_RENAME_PASS')
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify complete distribution set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name 'stegverse_stegcore-*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'stegverse_stegcore-*.tar.gz' | wc -l)" -eq 1
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import stegcore
          assert importlib.metadata.version('stegverse-stegcore')
          print('STEGVERSE_STEGCORE_PUBLIC_PACKAGE_IMPORT_PASS')
          PY

      - name: Upload distributions for publish job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stegverse-stegcore/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
