name: Validate GLM Boundary Packet

on:
  push:
    paths:
      - 'glm/**'
      - 'schemas/glm/**'
      - 'examples/glm/**'
      - 'docs/glm/**'
      - 'docs/STEGCORE_GLM_MIRROR_HANDOFF.md'
      - 'tools/glm/**'
      - '.github/workflows/validate-glm-boundary.yml'
  pull_request:
    paths:
      - 'glm/**'
      - 'schemas/glm/**'
      - 'examples/glm/**'
      - 'docs/glm/**'
      - 'docs/STEGCORE_GLM_MIRROR_HANDOFF.md'
      - 'tools/glm/**'
      - '.github/workflows/validate-glm-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-glm-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GLM boundary packet
        run: python tools/glm/check_glm_packet.py
