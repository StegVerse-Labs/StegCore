name: Governed Execution Orchestrator

# Cost-containment / sovereignty rule:
# GitHub-hosted Actions may validate this surface on explicit repository events,
# but recurring operational advancement belongs on StegVerse-controlled workers.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/stegcore/execution_orchestrator.py'
      - 'scripts/run_execution_orchestrator.py'
      - 'tests/test_execution_orchestrator.py'
      - 'data/execution-orchestrator-tasks.json'
      - 'docs/EXECUTION_ORCHESTRATOR_MIRROR_HANDOFF.md'
      - '.github/workflows/execution-orchestrator.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: stegcore-execution-orchestrator
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate execution state machine
        run: PYTHONPATH=src python -m pytest -q tests/test_execution_orchestrator.py
      - name: Run execution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEGVERSE_ORCHESTRATOR_TOKEN: ${{ secrets.STEGVERSE_ORCHESTRATOR_TOKEN }}
        run: PYTHONPATH=src python scripts/run_execution_orchestrator.py
      - name: Persist execution state
        run: |
          git config user.name "stegcore-execution-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add data/execution-orchestrator-state.json
          git diff --cached --quiet || git commit -m "Record governed execution state [skip ci]"
          git pull --rebase
          git push
      - name: Preserve execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: stegcore-execution-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/execution-orchestrator-state.json
          if-no-files-found: error
          retention-days: 30
