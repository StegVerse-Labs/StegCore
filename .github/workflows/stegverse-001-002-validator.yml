name: Validate StegVerse 001 002 Baseline - No Non-TV/TVC Credential Authority

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert credential-clean validation environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done

      - name: Anonymous public repository fetch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then SOURCE_REF="refs/pull/${PR_NUMBER}/merge"; else SOURCE_REF="${GITHUB_SHA}"; fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Select preinstalled Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(find /opt/hostedtoolcache/Python -path '*/3.11.*/x64/bin/python' -type f | sort -V | tail -1)"
          test -n "${PYTHON_BIN}"
          echo "$(dirname "${PYTHON_BIN}")" >> "${GITHUB_PATH}"

      - name: Validate no non-TV/TVC validation credential path
        run: python scripts/validate_no_non_tvtvc_validation_credentials.py

      - name: Compile source and tests
        run: python -m compileall src tests

      - name: Validate baseline manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('activation_manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema']['name'] == 'stegverse.stegcore.activation_manifest'
          assert manifest['activation_target']['name'] == 'stegverse_001_002_controlled_baseline'
          assert 'commit_time_context_present' in manifest['required_inputs']
          assert 'stale_context' in manifest['blocking_conditions']
          assert 'authority_overreach' in manifest['blocking_conditions']
          print('ok')
          PY
