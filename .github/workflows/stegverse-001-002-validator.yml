name: StegVerse 001/002 Validator
on:
  push:
    paths: ['entities/**','schemas/**','tests/**','tools/evaluate_admissibility.py','tools/check_activation_registry.py','tools/update_activation_status.py','registry/**','docs/STEGVERSE_001_002_BASELINE.md','docs/STEGVERSE_001_002_VALIDATOR.md','docs/STEGVERSE_001_002_CI.md','.github/workflows/stegverse-001-002-validator.yml']
  pull_request:
    paths: ['entities/**','schemas/**','tests/**','tools/evaluate_admissibility.py','tools/check_activation_registry.py','tools/update_activation_status.py','registry/**','docs/STEGVERSE_001_002_BASELINE.md','docs/STEGVERSE_001_002_VALIDATOR.md','docs/STEGVERSE_001_002_CI.md','.github/workflows/stegverse-001-002-validator.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate-001-002-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip && python -m pip install pyyaml pytest
      - run: python tools/evaluate_admissibility.py tests/vectors/admissibility_baseline_vectors.yml
      - run: python -m pytest tests/test_admissibility_baseline.py
      - run: python tools/check_activation_registry.py
      - run: python -m pytest tests/test_activation_registry.py
      - run: python -m pytest tests/test_update_activation_status.py
      - run: python tools/update_activation_status.py --dry-run
