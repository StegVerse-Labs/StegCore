name: Validate Admissible-Existence Task Conformance

on:
  push:
    paths:
      - 'management/admissible-existence-task-conformance-*.json'
      - 'scripts/verify_admissible_existence_task_conformance.py'
      - 'tests/test_admissible_existence_task_conformance.py'
      - 'docs/ADMISSIBLE_EXISTENCE_TASK_CONFORMANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate-admissible-existence-task-conformance.yml'
  pull_request:
    paths:
      - 'management/admissible-existence-task-conformance-*.json'
      - 'scripts/verify_admissible_existence_task_conformance.py'
      - 'tests/test_admissible_existence_task_conformance.py'
      - 'docs/ADMISSIBLE_EXISTENCE_TASK_CONFORMANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate-admissible-existence-task-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert credential boundary
        run: |
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN_EXPORTED_FOR_RUNTIME:-}"
          ! grep -R "secrets\." .github/workflows/validate-admissible-existence-task-conformance.yml
      - name: Run focused conformance tests
        run: python -m pytest -q tests/test_admissible_existence_task_conformance.py
      - name: Verify canonical policy is JSON-decodable
        run: python -m json.tool management/admissible-existence-task-conformance-policy.json >/dev/null
      - name: Verify canonical handoff manifest is JSON-decodable
        run: python -m json.tool management/admissible-existence-task-conformance-handoff.json >/dev/null
