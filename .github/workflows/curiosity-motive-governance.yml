name: Curiosity motive governance

on:
  push:
    paths:
      - "src/stegcore/motive_governance.py"
      - "tests/test_motive_governance.py"
      - "examples/curiosity-governance/**"
      - "docs/CURIOSITY_AFFECTIVE_GOVERNANCE_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-governance.yml"
  pull_request:
    paths:
      - "src/stegcore/motive_governance.py"
      - "tests/test_motive_governance.py"
      - "examples/curiosity-governance/**"
      - "docs/CURIOSITY_AFFECTIVE_GOVERNANCE_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Verify replay, motive separation, authority, and observer records
        run: pytest -q tests/test_motive_governance.py
