name: Curiosity motive governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/stegcore/motive_governance.py"
      - "tests/test_motive_governance.py"
      - "examples/curiosity-governance/**"
      - "evidence/release-readiness.json"
      - "evidence/runtime-validation.json"
      - "evidence/custody-chain-semantics-reopening-001.json"
      - "evidence/custody-hash-transition-reference-001.json"
      - "tests/test_custody_evidence_envelopes.py"
      - "docs/CURIOSITY_AFFECTIVE_GOVERNANCE_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-governance.yml"
  push:
    branches: [main]
    paths:
      - "src/stegcore/motive_governance.py"
      - "tests/test_motive_governance.py"
      - "examples/curiosity-governance/**"
      - "evidence/release-readiness.json"
      - "evidence/runtime-validation.json"
      - "evidence/custody-chain-semantics-reopening-001.json"
      - "evidence/custody-hash-transition-reference-001.json"
      - "tests/test_custody_evidence_envelopes.py"
      - "docs/CURIOSITY_AFFECTIVE_GOVERNANCE_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-governance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Validate motive governance and custody evidence envelopes
        run: python -m pytest -q tests/test_motive_governance.py tests/test_custody_evidence_envelopes.py
      - name: Verify hash-transition reference is present
        run: python -m json.tool evidence/custody-hash-transition-reference-001.json >/dev/null
      - name: Emit exact-head execution receipt
        run: |
          mkdir -p reports/current
          python - <<'PY' | tee reports/current/custody-evidence-envelope-execution.json
          import json, os
          print(json.dumps({"repository":"StegVerse-Labs/StegCore","workflow":"Curiosity motive governance","head_sha":os.environ['GITHUB_SHA'],"execution_state":"EXECUTED","authority_effect":"NONE"}, sort_keys=True))
          PY
      - name: Upload custody-evidence envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custody-evidence-envelope-${{ github.sha }}
          path: |
            reports/current/custody-evidence-envelope-execution.json
            evidence/release-readiness.json
            evidence/runtime-validation.json
            evidence/custody-chain-semantics-reopening-001.json
            evidence/custody-hash-transition-reference-001.json
            docs/CURIOSITY_AFFECTIVE_GOVERNANCE_MIRROR_HANDOFF.md
          if-no-files-found: error
          retention-days: 30
