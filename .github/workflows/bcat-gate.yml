name: BCAT Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  bcat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate BCAT Declaration
        run: |
          if [ ! -f bcat.yaml ]; then
            echo "BCAT declaration (bcat.yaml) missing"
            exit 1
          fi
          python StegCore/scripts/validate_bcat.py bcat.yaml
