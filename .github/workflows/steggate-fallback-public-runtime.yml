name: StegGate Heartbeat Public Runtime

on:
  repository_dispatch:
    types: [stegverse-heartbeat]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/steggate-fallback-public-runtime.yml"
      - "src/stegcore/steggate.py"
      - "src/stegcore/steggate_runtime.py"
      - "src/stegcore/service.py"
      - "scripts/observe_steggate_live_service.py"
      - "scripts/finalize_steggate_live_activation.py"
      - "pyproject.toml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: steggate-heartbeat-public-runtime
  cancel-in-progress: false

jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REGISTRY_COMMENT_ID: "5228464425"
      HEARTBEAT_EPOCH: ${{ github.event.client_payload.epoch || 'bootstrap' }}
      HEARTBEAT_ID: ${{ github.event.client_payload.heartbeat_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record heartbeat claim
        run: |
          mkdir -p build
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/steggate-heartbeat-claim.json').write_text(json.dumps({
            'schema': 'stegverse.steggate_heartbeat_claim.v1',
            'heartbeat_id': os.environ['HEARTBEAT_ID'],
            'heartbeat_epoch': os.environ['HEARTBEAT_EPOCH'],
            'goal_id': 'STEGGATE-FULL-FUNCTIONAL-ACTIVATION-001',
            'authority_effect': False,
            'scheduler': 'stegverse-heartbeat'
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Install canonical StegCore
        run: python -m pip install -e .

      - name: Start canonical StegGate HTTP service
        run: |
          mkdir -p build
          nohup uvicorn stegcore.service:app --host 127.0.0.1 --port 8000 > build/steggate-fallback-app.log 2>&1 &
          echo $! > build/steggate-fallback-app.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > build/steggate-fallback-local-health.json; then exit 0; fi
            sleep 1
          done
          cat build/steggate-fallback-app.log
          exit 1

      - name: Install Cloudflare tunnel client
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Open zero-credential public tunnel and wait for edge readiness
        id: tunnel
        run: |
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8000 > build/steggate-fallback-tunnel.log 2>&1 &
          echo $! > build/steggate-fallback-tunnel.pid
          ORIGIN=""
          for attempt in $(seq 1 60); do
            ORIGIN="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' build/steggate-fallback-tunnel.log | tail -1 || true)"
            [ -n "$ORIGIN" ] && break
            sleep 1
          done
          test -n "$ORIGIN" || { cat build/steggate-fallback-tunnel.log; exit 1; }
          echo "$ORIGIN" > build/steggate-fallback-origin.txt
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 10 "$ORIGIN/health" > build/steggate-fallback-public-health.json 2>build/steggate-fallback-public-health.err; then
              echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          cat build/steggate-fallback-tunnel.log
          cat build/steggate-fallback-public-health.err || true
          exit 1

      - name: Verify full public StegGate acceptance contract
        env:
          STEGGATE_ORIGIN: ${{ steps.tunnel.outputs.origin }}
        run: |
          python scripts/observe_steggate_live_service.py | tee build/steggate-fallback-observer.stdout
          cp build/steggate-live-observation.json build/steggate-fallback-live-proof.json

      - name: Update verified runtime registry
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ steps.tunnel.outputs.origin }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/registry.md"
          import json, os
          from pathlib import Path
          proof=json.loads(Path('build/steggate-fallback-live-proof.json').read_text())
          print('## StegGate heartbeat public-runtime registry')
          print()
          print('State: `LIVE_ACCEPTANCE_PASS`')
          print()
          print(f"Heartbeat epoch: `{os.environ['HEARTBEAT_EPOCH']}`")
          print(f"Heartbeat id: `{os.environ['HEARTBEAT_ID']}`")
          print(f"Current public origin: `{os.environ['ORIGIN']}`")
          print(f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`")
          print(f"StegCore commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('Acceptance: `/health` PASS; `/v1/self-test` exact four-disposition PASS; `/v1/evaluate` complete-matrix PASS.')
          print(f"Observed at: `{proof.get('observed_at')}`")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REGISTRY_COMMENT_ID}" --method PATCH --raw-field body="$(cat "$RUNNER_TEMP/registry.md")" >/dev/null

      - name: Finalize functional activation immediately after hosted PASS
        env:
          STEGGATE_DEPLOYMENT_SOURCE: heartbeat_ephemeral_micronode
        run: python scripts/finalize_steggate_live_activation.py | tee build/steggate-finalization.json

      - name: Persist canonical activation through protected-main PR
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'stegverse-heartbeat-worker'
          git config user.email '210078727+StegVerse@users.noreply.github.com'
          git add data/steggate-live-activation-receipt.json data/steggate-session-context.json management/steggate-full-functional-activation.json STEGCORE_MIRROR_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'pr_number=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="automation/steggate-activation-${HEARTBEAT_ID}"
          git checkout -b "$BRANCH"
          git commit -m 'Finalize StegGate activation from heartbeat worker'
          git push --force-with-lease origin "$BRANCH"
          PR_URL="$(gh pr create --repo StegVerse-Labs/StegCore --base main --head "$BRANCH" --title 'Finalize StegGate activation from heartbeat worker' --body "Heartbeat-owned ephemeral StegGate produced full hosted acceptance PASS. Heartbeat id: ${HEARTBEAT_ID}; epoch: ${HEARTBEAT_EPOCH}. This PR persists the canonical activation receipt and reconciled state through the protected-main path.")"
          PR_NUMBER="${PR_URL##*/}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR_NUMBER" --repo StegVerse-Labs/StegCore --auto --squash

      - name: Wait for protected-main activation merge
        if: steps.persist.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.persist.outputs.pr_number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            STATE="$(gh pr view "$PR_NUMBER" --repo StegVerse-Labs/StegCore --json state,mergedAt --jq 'if .mergedAt then "MERGED" else .state end')"
            if [ "$STATE" = "MERGED" ]; then exit 0; fi
            if [ "$STATE" = "CLOSED" ]; then exit 1; fi
            sleep 20
          done
          echo "Activation PR did not merge within the heartbeat lease."
          exit 1

      - name: Close canonical activation issue
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ steps.tunnel.outputs.origin }}
        run: |
          if gh issue view 68 --repo StegVerse-Labs/StegCore --json state --jq '.state' | grep -q '^OPEN$'; then
            gh issue comment 68 --repo StegVerse-Labs/StegCore --body "Heartbeat-owned ephemeral StegGate runtime produced full hosted PASS at ${ORIGIN}, persisted the canonical activation receipt through protected-main PR checks, and completed the functional activation path. Heartbeat epoch: ${HEARTBEAT_EPOCH}; heartbeat id: ${HEARTBEAT_ID}."
            gh issue close 68 --repo StegVerse-Labs/StegCore --reason completed
          fi

      - name: Preserve activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: steggate-heartbeat-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/steggate-heartbeat-claim.json
            build/steggate-fallback-*
            build/steggate-live-observation.json
            build/steggate-finalization.json
            data/steggate-live-activation-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Supervise and self-heal runtime through heartbeat lease window
        run: |
          END=$(( $(date +%s) + 3900 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            ORIGIN="$(cat build/steggate-fallback-origin.txt)"
            if curl --fail --silent --max-time 10 "$ORIGIN/health" >/dev/null 2>&1; then sleep 30; continue; fi
            kill "$(cat build/steggate-fallback-tunnel.pid)" 2>/dev/null || true
            : > build/steggate-fallback-tunnel.log
            nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8000 > build/steggate-fallback-tunnel.log 2>&1 &
            echo $! > build/steggate-fallback-tunnel.pid
            NEW_ORIGIN=""
            for attempt in $(seq 1 60); do
              NEW_ORIGIN="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' build/steggate-fallback-tunnel.log | tail -1 || true)"
              if [ -n "$NEW_ORIGIN" ] && curl --fail --silent --max-time 10 "$NEW_ORIGIN/health" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            [ -n "$NEW_ORIGIN" ] || { sleep 30; continue; }
            STEGGATE_ORIGIN="$NEW_ORIGIN" python scripts/observe_steggate_live_service.py >/dev/null 2>&1 || { sleep 30; continue; }
            echo "$NEW_ORIGIN" > build/steggate-fallback-origin.txt
            sleep 30
          done
