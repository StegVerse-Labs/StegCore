name: StegGate Optional Hosted Fallback Declaration

# This workflow intentionally does not launch StegGate, download tunnel software,
# create a public tunnel, mutate GitHub state, finalize activation, supervise a
# lease, or create runtime evidence. Canonical runtime work belongs to the
# resident StegVerse lane. A third-party carrier may only be selected later by
# an explicitly authorized fallback path outside this validation surface.
on:
  workflow_dispatch:

permissions: {}

jobs:
  fallback-declaration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STEGVERSE_PROVIDER_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "credential-bearing environment is not permitted on fallback declaration surface: ${name}" >&2
              exit 1
            fi
          done

      - name: Declare resident runtime requirement
        shell: bash
        run: |
          cat <<'EOF'
          STEGGATE_CANONICAL_RUNTIME=RESIDENT_STEGVERSE
          STEGGATE_HOSTED_RUNTIME=false
          STEGGATE_HOSTED_PUBLIC_TUNNEL=false
          STEGGATE_THIRD_PARTY_CARRIER_REQUIRED=false
          STEGGATE_FALLBACK_SELECTION=EXPLICIT_OPT_IN_ONLY
          STEGGATE_GITHUB_RUNTIME_AUTHORITY=NONE
          STEGGATE_ACTIVATION_EFFECT=NONE
          STEGGATE_REPOSITORY_MUTATION=NONE
          STEGGATE_RUNTIME_EVIDENCE_CREATED=false
          EOF

      - name: Verify hosted runtime remains retired
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/steggate-fallback-public-runtime.yml').read_text(encoding='utf-8')
          forbidden = (
              'repository_' + 'dispatch:',
              'contents: ' + 'write',
              'issues: ' + 'write',
              'pull-requests: ' + 'write',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'cloud' + 'flared',
              'try' + 'cloudflare.com',
              'nohup ' + 'uvicorn',
              'gh ' + 'api',
              'gh ' + 'pr create',
              'git ' + 'push',
              'upload-' + 'artifact@',
              'finalize_steggate_live_activation.py',
              'Supervise and self-heal runtime',
          )
          assert 'permissions: {}' in source
          assert 'workflow_dispatch:' in source
          assert 'STEGGATE_CANONICAL_RUNTIME=RESIDENT_STEGVERSE' in source
          assert 'STEGGATE_HOSTED_RUNTIME=false' in source
          assert 'STEGGATE_THIRD_PARTY_CARRIER_REQUIRED=false' in source
          assert 'STEGGATE_FALLBACK_SELECTION=EXPLICIT_OPT_IN_ONLY' in source
          assert all(marker not in source for marker in forbidden), forbidden
          print('STEGGATE_OPTIONAL_HOSTED_FALLBACK_DECLARATION=PASS')
          print('STEGGATE_CANONICAL_RUNTIME=RESIDENT_STEGVERSE')
          print('STEGGATE_THIRD_PARTY_CARRIER_REQUIRED=false')
          print('STEGGATE_ACTIVATION_EFFECT=NONE')
          PY
