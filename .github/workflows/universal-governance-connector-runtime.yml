name: Universal Governance Connector Runtime

on:
  pull_request:
    paths:
      - "src/stegcore/universal_governance_connector.py"
      - "tests/test_universal_governance_connector.py"
      - "tests/test_governance_intr_vertical_slice.py"
      - "docs/UNIVERSAL_GOVERNANCE_CONNECTOR_RUNTIME_MIRROR_HANDOFF.md"
      - "scripts/verify_universal_governance_connector_contract.py"
      - "scripts/verify_stegos_universal_intr_snapshot.py"
      - "contracts/universal_governance_connector_snapshot/**"
      - "contracts/stegos_universal_intr_snapshot/**"
      - ".github/workflows/universal-governance-connector-runtime.yml"
  push:
    branches: [main]
    paths:
      - "src/stegcore/universal_governance_connector.py"
      - "tests/test_universal_governance_connector.py"
      - "docs/UNIVERSAL_GOVERNANCE_CONNECTOR_RUNTIME_MIRROR_HANDOFF.md"
      - "scripts/verify_universal_governance_connector_contract.py"
      - "contracts/universal_governance_connector_snapshot/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install -e .
      - name: Compile connector
        run: python -m py_compile src/stegcore/universal_governance_connector.py tests/test_universal_governance_connector.py tests/test_governance_intr_vertical_slice.py scripts/verify_universal_governance_connector_contract.py scripts/verify_stegos_universal_intr_snapshot.py
      - name: Run connector tests
        run: |
          python -m unittest -v tests.test_universal_governance_connector
          python -m unittest -v tests.test_governance_intr_vertical_slice
      - name: Verify pinned Governance connector contract
        run: python scripts/verify_universal_governance_connector_contract.py
      - name: Verify pinned StegOS Universal InTr snapshot
        run: python scripts/verify_stegos_universal_intr_snapshot.py
