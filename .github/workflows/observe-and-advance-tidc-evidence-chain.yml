name: Observe and Advance TIDC Evidence Chain

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/observe_and_advance_tidc_evidence_chain.py'
      - 'ecosystem_management/tidc_evidence_chain_registry.json'
      - 'docs/TIDC_EVIDENCE_CHAIN_MIRROR_HANDOFF.md'
      - '.github/workflows/observe-and-advance-tidc-evidence-chain.yml'

permissions:
  contents: write

concurrency:
  group: tidc-evidence-chain-observer
  cancel-in-progress: false

jobs:
  observe-and-advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe Site state and emit executable tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/observe_and_advance_tidc_evidence_chain.py
      - name: Validate observer output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('brain_reports/tidc_evidence_chain_observation.json')
          d = json.loads(p.read_text())
          assert d['development_halted'] is False
          assert d['authority_effect'] == 'NONE'
          assert d['next_executable_tasks']
          for task in d['next_executable_tasks']:
              assert task['owner_repo']
              assert task['location']
          print('TIDC_OBSERVER_OUTPUT_VALID')
          PY
      - name: Commit changed observation receipt
        run: |
          if git diff --quiet -- brain_reports/tidc_evidence_chain_observation.json; then
            echo 'Observation receipt unchanged.'
            exit 0
          fi
          git config user.name 'stegverse-ecosystem-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add brain_reports/tidc_evidence_chain_observation.json
          git commit -m 'chore: refresh TIDC evidence-chain observation receipt'
          git push
