name: Manifold Governance Production Validation (Non-Authorizing)

on:
  pull_request:
    branches: [main]
    paths:
      - src/stegcore/manifold_governance.py
      - src/stegcore/__init__.py
      - tests/test_manifold_governance.py
      - MANIFOLD_GOVERNANCE_MIRROR_HANDOFF.md
      - .github/workflows/manifold-governance-production.yml
  push:
    branches: [main]
    paths:
      - src/stegcore/manifold_governance.py
      - src/stegcore/__init__.py
      - tests/test_manifold_governance.py
      - MANIFOLD_GOVERNANCE_MIRROR_HANDOFF.md
      - .github/workflows/manifold-governance-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without persisted credential
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install and validate canonical manifold governance
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install .
          python -m pytest -q tests/test_manifold_governance.py
          python -m py_compile src/stegcore/manifold_governance.py src/stegcore/__init__.py

      - name: Prove production manifold invariants
        run: |
          set -eu
          python - <<'PY'
          from stegcore.manifold_governance import PopulationTransition, govern_manifold_action
          from stegcore.steggate import AdmissibilityRequest
          import json

          base=json.load(open('examples/steggate_allow_request.json'))
          review=json.loads(json.dumps(base))
          review['approval']['required']=True
          rows=[
              PopulationTransition('T-A','M0',AdmissibilityRequest.model_validate(base)),
              PopulationTransition('T-B','M0',AdmissibilityRequest.model_validate(base), depends_on=('T-A',)),
              PopulationTransition('T-REVIEW','M0',AdmissibilityRequest.model_validate(review)),
              PopulationTransition('T-AFTER','M0',AdmissibilityRequest.model_validate(base), depends_on=('T-REVIEW',)),
          ]
          action=govern_manifold_action(rows, authority_boundary_refs=('authority:human-review',))
          assert action.state == 'REVIEWABLE'
          assert action.continue_transition_ids == ('T-A','T-B')
          assert action.review_transition_ids == ('T-REVIEW',)
          assert action.held_transition_ids == ('T-AFTER',)
          assert action.external_execution_performed is False
          inv=action.reviewable_projection['governance_invariants']
          assert inv['wall_clock_is_governance_authority'] is False
          assert inv['heartbeat_is_governance_authority'] is False
          assert inv['linear_transition_path_required'] is False
          assert inv['protected_boundary_crossing_requires_external_authority'] is True
          print('MANIFOLD_GOVERNANCE_PRODUCTION_PASS')
          PY

      - name: Record validation-only authority boundary
        run: |
          echo 'checkout_credential_persisted=false'
          echo 'production_runtime_authority=NONE'
          echo 'credential_authority=TV/TVC'
          echo 'validation_transport_authority=GITHUB_ACTIONS_ONLY'
