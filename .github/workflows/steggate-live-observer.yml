name: StegGate Live Service Observer

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/stegcore/steggate.py'
      - 'src/stegcore/service.py'
      - 'scripts/observe_steggate_live_service.py'
      - 'scripts/finalize_steggate_live_activation.py'
      - 'tests/test_steggate_live_observer.py'
      - 'tests/test_finalize_steggate_live_activation.py'
      - 'data/steggate-session-context.json'
      - 'data/steggate-architecture-reconciliation-state.json'
      - '.github/workflows/steggate-live-observer.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: steggate-live-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Validate observer and finalizer semantics
        run: python -m pytest -q tests/test_steggate_live_observer.py tests/test_finalize_steggate_live_activation.py
      - name: Observe canonical hosted service
        id: observe
        continue-on-error: true
        env:
          STEGGATE_ORIGIN: https://steggate-core.onrender.com
        run: python scripts/observe_steggate_live_service.py
      - name: Preserve observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steggate-live-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/steggate-live-observation.json
          if-no-files-found: error
          retention-days: 90
      - name: Finalize canonical activation after full hosted PASS
        if: steps.observe.outcome == 'success'
        run: python scripts/finalize_steggate_live_activation.py
      - name: Commit canonical activation receipt
        if: steps.observe.outcome == 'success'
        run: |
          git config user.name 'stegverse-automation'
          git config user.email 'stegverse-automation@users.noreply.github.com'
          git add data/steggate-live-activation-receipt.json data/steggate-session-context.json management/steggate-full-functional-activation.json STEGCORE_MIRROR_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Activation state already reconciled.'
          else
            git commit -m 'Finalize canonical StegGate hosted activation'
            git push origin HEAD:main
          fi
      - name: Close canonical activation issue after receipt is persisted
        if: steps.observe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 68 --repo StegVerse-Labs/StegCore --body 'Repository-native live observer recorded full hosted PASS for health, exact four-disposition self-test, and deterministic complete-matrix evaluation. Canonical activation receipt has been persisted by this workflow; closing the activation lane.'
          gh issue close 68 --repo StegVerse-Labs/StegCore --reason completed
      - name: Keep activation fail-closed until hosted checks pass
        if: steps.observe.outcome != 'success'
        run: |
          echo 'Canonical StegGate hosted activation is not yet observed.'
          exit 1
