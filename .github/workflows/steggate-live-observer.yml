name: StegGate Live Service Observer

# The canonical StegGate runtime is machine-owned by StegVerse. GitHub-hosted
# polling is no longer a recurring continuity mechanism. Keep this workflow for
# explicit/manual and source-change verification only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/stegcore/steggate.py'
      - 'src/stegcore/service.py'
      - 'src/stegcore/endpoint_discovery.py'
      - 'scripts/observe_steggate_live_service.py'
      - 'scripts/finalize_steggate_live_activation.py'
      - 'tests/test_steggate_live_observer.py'
      - 'tests/test_finalize_steggate_live_activation.py'
      - 'tests/test_endpoint_discovery.py'
      - 'data/steggate-session-context.json'
      - 'data/steggate-architecture-reconciliation-state.json'
      - '.github/workflows/steggate-live-observer.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: steggate-live-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Validate observer, discovery, and finalizer semantics
        run: python -m pytest -q tests/test_steggate_live_observer.py tests/test_finalize_steggate_live_activation.py tests/test_endpoint_discovery.py
      - name: Resolve a verified live StegGate origin
        id: resolve
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from stegcore.endpoint_discovery import resolve_steggate_origin
          result = resolve_steggate_origin(timeout=12)
          print(json.dumps(result.to_dict(), sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"state={result.state}\n")
              fh.write(f"origin={result.origin or ''}\n")
              fh.write(f"source={result.source or ''}\n")
          if result.state != 'LIVE' or not result.origin:
              raise SystemExit(2)
          PY
      - name: Observe resolved canonical service
        id: observe
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        env:
          STEGGATE_ORIGIN: ${{ steps.resolve.outputs.origin }}
        run: python scripts/observe_steggate_live_service.py
      - name: Preserve observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steggate-live-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/steggate-live-observation.json
          if-no-files-found: warn
          retention-days: 90
      - name: Finalize canonical activation after full hosted PASS
        if: steps.observe.outcome == 'success'
        env:
          STEGGATE_DEPLOYMENT_SOURCE: ${{ steps.resolve.outputs.source }}
        run: python scripts/finalize_steggate_live_activation.py
      - name: Commit canonical activation receipt
        if: steps.observe.outcome == 'success'
        run: |
          git config user.name 'stegverse-automation'
          git config user.email 'stegverse-automation@users.noreply.github.com'
          git add data/steggate-live-activation-receipt.json data/steggate-session-context.json management/steggate-full-functional-activation.json STEGCORE_MIRROR_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Activation state already reconciled.'
          else
            git commit -m 'Finalize canonical StegGate hosted activation'
            git push origin HEAD:main
          fi
      - name: Close canonical activation issue after receipt is persisted
        if: steps.observe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 68 --repo StegVerse-Labs/StegCore --body "Repository-native live observer recorded full hosted PASS for health, exact four-disposition self-test, and deterministic complete-matrix evaluation through source '${{ steps.resolve.outputs.source }}'. Canonical activation receipt has been persisted by this workflow; closing the functional activation lane. Persistent hosting hardening remains a separate non-authority-escalating objective when applicable."
          gh issue close 68 --repo StegVerse-Labs/StegCore --reason completed
      - name: Keep activation fail-closed until hosted checks pass
        if: steps.observe.outcome != 'success'
        run: |
          echo 'No verified StegGate hosted activation is currently observable.'
          exit 1
