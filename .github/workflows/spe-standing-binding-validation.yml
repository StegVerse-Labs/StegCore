name: SPE Standing Canonical Binding Validation

on:
  pull_request:
    paths:
      - 'src/stegcore/standing_binding.py'
      - 'src/stegcore/steggate_runtime.py'
      - 'tests/test_spe_standing_binding.py'
      - 'tests/test_steggate_runtime.py'
      - '.github/workflows/spe-standing-binding-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-standing-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credential
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact source and test runner
        run: |
          python -m pip install --disable-pip-version-check --no-input -e .
          python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run standing and canonical runtime tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          TVC_PRIVATE_SOURCE_READ_TOKEN: ''
          TVC_EPHEMERAL_GITHUB_TOKEN: ''
        run: |
          python -m pytest -q \
            tests/test_spe_standing_binding.py \
            tests/test_steggate_runtime.py
      - name: Verify product consistency
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: python scripts/verify_product_consistency.py
      - name: Compile changed runtime surfaces
        run: |
          python -m py_compile \
            src/stegcore/standing_binding.py \
            src/stegcore/steggate_runtime.py
      - name: Prove no credential authority introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          text = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in (
                  'src/stegcore/standing_binding.py',
                  'src/stegcore/steggate_runtime.py',
              )
          )
          for forbidden in (
              'GITHUB_TOKEN',
              'GH_TOKEN',
              'TVC_PRIVATE_SOURCE_READ_TOKEN',
              'TVC_EPHEMERAL_GITHUB_TOKEN',
          ):
              assert forbidden not in text, f'credential authority reference introduced: {forbidden}'
          print('SPE_STANDING_BINDING_NON_AUTHORIZING_SOURCE_OK')
          PY
