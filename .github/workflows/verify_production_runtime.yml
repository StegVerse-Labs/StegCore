name: Verify Production Runtime Coherence

on:
  push:
    paths:
      - "src/stegcore/runtime.py"
      - "src/stegcore/commit_governance.py"
      - "tests/test_runtime_commit_coherence.py"
      - ".github/workflows/verify_production_runtime.yml"
  pull_request:
    paths:
      - "src/stegcore/runtime.py"
      - "src/stegcore/commit_governance.py"
      - "tests/test_runtime_commit_coherence.py"
      - ".github/workflows/verify_production_runtime.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run runtime coherence tests
        run: python -m pytest -q tests/test_runtime_commit_coherence.py tests/test_commit_governance.py
