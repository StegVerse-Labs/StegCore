name: Independent Release Policy Validation

on:
  pull_request:
    paths:
      - 'contracts/release_policy/**'
      - 'scripts/validate_independent_release_policy.py'
      - 'tests/test_independent_release_policy.py'
      - 'evidence/independent-release-policy.json'
      - 'evidence/release-readiness.json'
      - 'management/independent-release-policy-task.json'
      - 'docs/INDEPENDENT_RELEASE_POLICY_MIRROR_HANDOFF.md'
      - '.github/workflows/independent-release-policy.yml'
      - '.github/workflows/activate-authorized-release-tag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused release-policy tests
        run: python -m pytest -q tests/test_independent_release_policy.py
      - name: Compile validator
        run: python -m py_compile scripts/validate_independent_release_policy.py
      - name: Evaluate current independent policy decision
        run: |
          python scripts/validate_independent_release_policy.py \
            --decision evidence/independent-release-policy.json \
            --readiness evidence/release-readiness.json \
            --output /tmp/independent-release-policy-validation.json
      - name: Verify release-readiness self-hash
        run: |
          python - <<'PY'
          import hashlib, json
          d = json.load(open('evidence/release-readiness.json'))
          declared = d.pop('assessment_hash')
          actual = hashlib.sha256(json.dumps(d, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          assert declared == actual, (declared, actual)
          assert d['gates']['independent_release_policy'] == 'pass'
          assert d['tag_permitted'] is True
          assert d['release_permitted'] is False
          PY
      - name: Upload policy validation state
        uses: actions/upload-artifact@v4
        with:
          name: independent-release-policy-validation
          path: /tmp/independent-release-policy-validation.json
          if-no-files-found: error
