name: Validate 001/002 decision bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/stegcore/adapters/**"
      - "tests/test_entity_001_002_decision_bridge.py"
      - "docs/STEGCORE_001_002_DECISION_BRIDGE.md"
      - ".github/workflows/validate-001-002-decision-bridge.yml"
  push:
    paths:
      - "src/stegcore/adapters/**"
      - "tests/test_entity_001_002_decision_bridge.py"
      - "docs/STEGCORE_001_002_DECISION_BRIDGE.md"
      - ".github/workflows/validate-001-002-decision-bridge.yml"

jobs:
  validate-001-002-decision-bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bridge tests
        run: PYTHONPATH=src python -m unittest discover -s tests
