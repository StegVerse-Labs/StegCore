name: Authority Basis Resolution Validation

on:
  pull_request:
    paths:
      - "src/stegcore/authority_basis.py"
      - "tests/test_authority_basis.py"
      - "README.md"
      - "docs/SDK_AUTHORITY_BASIS_RESOLUTION_MIRROR_HANDOFF.md"
      - ".github/workflows/authority-basis-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -e . pytest
      - name: Run focused authority-basis tests
        run: PYTHONPATH=src python -m pytest -q tests/test_authority_basis.py
      - name: Compile resolver
        run: python -m py_compile src/stegcore/authority_basis.py
