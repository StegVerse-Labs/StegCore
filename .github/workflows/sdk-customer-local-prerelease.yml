name: Private StegCore plus pinned public SDK local route (non-release)
on:
  pull_request:
    paths:
      - 'tests/test_sdk_customer_local_prerelease.py'
      - '.github/workflows/sdk-customer-local-prerelease.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-private-owner-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 212c0bfa3e69b88f98797c74e2043f6e056a2cbf
          path: .upstream/local-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public SDK draft exact source identity
        run: test "$(git -C .upstream/local-sdk rev-parse HEAD)" = "212c0bfa3e69b88f98797c74e2043f6e056a2cbf"
      - name: Install native private StegCore and public SDK draft from source
        run: python -m pip install . ./.upstream/local-sdk
      - name: Real canonical StegCore plus actual SDK source (fixture authority only)
        env:
          STEGCORE_TEST_LOCAL_SDK_ROOT: .upstream/local-sdk
        run: python -m unittest discover -s tests -p test_sdk_customer_local_prerelease.py -v

  original-private-owner-offline-source-wheel-test:
    # Exact PRIVATE StegCore and exact PUBLIC merged SDK source. Temporary
    # test-only wheels NEVER leave native CI or constitute TV/TVC release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 212c0bfa3e69b88f98797c74e2043f6e056a2cbf
          path: .upstream/local-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original pinned SDK and StegCore identities
        run: |
          test "$(git -C .upstream/local-sdk rev-parse HEAD)" = "212c0bfa3e69b88f98797c74e2043f6e056a2cbf"
          test "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "0.3.0"
      - name: Build exact native-source and all dependency wheels into CI-local wheelhouse
        run: |
          python -m pip install build wheel
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/icv-wheelhouse" . ./.upstream/local-sdk
      - name: Install to fresh isolated environment WITHOUT package index or network
        run: |
          python -m venv "$RUNNER_TEMP/icv-offline-venv"
          "$RUNNER_TEMP/icv-offline-venv/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/icv-wheelhouse" 'stegcore==0.3.0' 'stegverse-sdk==1.3.0'
      - name: Execute actual installed wheels with customer authority TEST FIXTURE
        env:
          STEGCORE_TEST_LOCAL_SDK_ROOT: .upstream/local-sdk
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export STEGCORE_TEST_LOCAL_SDK_ROOT="$GITHUB_WORKSPACE/.upstream/local-sdk"
          "$RUNNER_TEMP/icv-offline-venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_sdk_customer_local_prerelease.py -v
