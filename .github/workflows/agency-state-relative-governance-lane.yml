name: Agency State-Relative Governance Lane

on:
  pull_request:
    paths:
      - 'examples/governance_lanes/agency_state_relative/**'
      - 'scripts/run_agency_state_relative_lane.py'
      - 'tests/test_agency_state_relative_lane.py'
      - '.github/workflows/agency-state-relative-governance-lane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StegCore
        run: python -m pip install -e .
      - name: Run governed lane assertions
        run: python -m pytest -q tests/test_agency_state_relative_lane.py
      - name: Generate resultant manifest
        run: python scripts/run_agency_state_relative_lane.py | tee agency-state-relative-run.log
      - name: Show origination manifest
        run: cat examples/governance_lanes/agency_state_relative/origination_manifest.json
      - name: Show resultant manifest
        run: cat examples/governance_lanes/agency_state_relative/resultant_manifest.json
      - name: Upload lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-state-relative-governance-lane
          path: |
            examples/governance_lanes/agency_state_relative/origination_manifest.json
            examples/governance_lanes/agency_state_relative/resultant_manifest.json
            agency-state-relative-run.log
