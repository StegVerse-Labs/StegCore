name: Reusable StegGate Heartbeat Contract Validation

# GitHub-hosted execution is not a StegGate runtime carrier. This workflow is
# retained only as a compatibility/validation surface for callers that still
# reference the historical reusable workflow. Resident StegVerse workers own
# process execution, heartbeat continuity, public rendezvous materialization,
# recovery, and runtime evidence.
on:
  workflow_call:
    inputs:
      heartbeat_id:
        required: true
        type: string
      heartbeat_epoch:
        required: true
        type: string
      lease_id:
        required: true
        type: string
      lease_action:
        required: true
        type: string
      lease_dependents_json:
        required: true
        type: string
    outputs:
      acceptance_state:
        description: Compatibility validation state; never runtime acceptance.
        value: ${{ jobs.validate-contract.outputs.acceptance_state }}
  workflow_dispatch:

permissions: {}

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      acceptance_state: ${{ steps.contract.outputs.state }}
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'STEGGATE_GITHUB_HOSTED_RUNTIME_AUTHORITY=NONE'
          echo 'STEGGATE_THIRD_PARTY_CARRIER_REQUIRED=false'

      - name: Fetch exact StegCore source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/StegVerse-Labs/StegCore.git
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Validate heartbeat/lease compatibility contract only
        id: contract
        shell: bash
        env:
          HEARTBEAT_ID: ${{ inputs.heartbeat_id }}
          HEARTBEAT_EPOCH: ${{ inputs.heartbeat_epoch }}
          LEASE_ID: ${{ inputs.lease_id }}
          LEASE_ACTION: ${{ inputs.lease_action }}
          LEASE_DEPENDENTS_JSON: ${{ inputs.lease_dependents_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          heartbeat_id = os.environ.get('HEARTBEAT_ID','').strip()
          epoch = os.environ.get('HEARTBEAT_EPOCH','').strip()
          lease_id = os.environ.get('LEASE_ID','').strip()
          lease_action = os.environ.get('LEASE_ACTION','').strip()
          dependents_raw = os.environ.get('LEASE_DEPENDENTS_JSON','[]') or '[]'
          dependents = json.loads(dependents_raw)
          if not heartbeat_id or not epoch or not lease_id or not lease_action:
              raise SystemExit('heartbeat/lease compatibility inputs incomplete')
          if not isinstance(dependents, list):
              raise SystemExit('lease_dependents_json must decode to a list')
          print('STEGGATE_HEARTBEAT_COMPATIBILITY=PASS')
          print('STEGGATE_RUNTIME_EXECUTION=RESIDENT_REQUIRED')
          print('STEGGATE_PUBLIC_RENDEZVOUS=RESIDENT_OR_EXPLICIT_FALLBACK_REQUIRED')
          print('STEGGATE_GITHUB_ACTIONS_RUNTIME_ROLE=NONE')
          print('STEGGATE_CLOUDFLARE_REQUIRED=false')
          PY
          echo 'state=RESIDENT_RUNTIME_REQUIRED' >> "$GITHUB_OUTPUT"

      - name: Enforce no hosted runtime/carrier implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/steggate-heartbeat-worker-reusable.yml').read_text(encoding='utf-8')
          forbidden = (
              'cloudflared' + ' tunnel',
              'trycloudflare' + '.com',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'raw.githubusercontent' + '.com',
              'nohup uvicorn',
              'sleep 30',
              'timeout-minutes: 355',
              'permissions:\n  contents: read',
          )
          assert 'permissions: {}' in source
          assert 'RESIDENT_RUNTIME_REQUIRED' in source
          assert 'STEGGATE_CLOUDFLARE_REQUIRED=false' in source
          assert all(marker not in source for marker in forbidden), forbidden
          print('STEGGATE_HOSTED_CARRIER_RETIREMENT=PASS')
          print('STEGGATE_THIRD_PARTY_CARRIER_ROLE=OPTIONAL_EXPLICIT_FALLBACK_ONLY')
          PY
