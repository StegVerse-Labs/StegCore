name: Governed Runtime Adapter Conformance

on:
  push:
    paths:
      - "src/stegcore/runtime.py"
      - "src/stegcore/runtime_adapters.py"
      - "tests/test_governed_runtime_adapters.py"
      - "tests/test_runtime_commit_coherence.py"
      - "docs/DECISION_STATE_RECONSTRUCTION.md"
      - "STEGCORE_MIRROR_HANDOFF.md"
      - ".github/workflows/governed-runtime-adapters.yml"
  pull_request:
    paths:
      - "src/stegcore/runtime.py"
      - "src/stegcore/runtime_adapters.py"
      - "tests/test_governed_runtime_adapters.py"
      - "tests/test_runtime_commit_coherence.py"
      - "docs/DECISION_STATE_RECONSTRUCTION.md"
      - "STEGCORE_MIRROR_HANDOFF.md"
      - ".github/workflows/governed-runtime-adapters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile governed runtime surfaces
        run: |
          python -m py_compile src/stegcore/runtime.py src/stegcore/runtime_adapters.py

      - name: Run merged runtime boundary tests
        run: python -m pytest -q tests/test_runtime_commit_coherence.py

      - name: Run governed adapter conformance tests
        run: python -m pytest -q tests/test_governed_runtime_adapters.py

      - name: Verify no direct executor path in adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/stegcore/runtime_adapters.py").read_text()
          assert "governed_execute(" in source
          assert "executor()" not in source
          print("ADAPTER_BYPASS_STATIC_GUARD_PASS")
          PY
