name: Activate Authorized Release Tag

on:
  push:
    branches: [main]
    paths:
      - 'evidence/release-readiness.json'
      - 'evidence/independent-release-policy.json'
      - 'scripts/validate_independent_release_policy.py'
      - '.github/workflows/activate-authorized-release-tag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify imported independent policy decision
        run: |
          python scripts/validate_independent_release_policy.py \
            --decision evidence/independent-release-policy.json \
            --readiness evidence/release-readiness.json \
            --output /tmp/independent-release-policy-validation.json
      - name: Verify release-readiness self-hash and tag scope
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('evidence/release-readiness.json')
          d = json.loads(p.read_text())
          declared = d.pop('assessment_hash')
          actual = hashlib.sha256(json.dumps(d, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          assert declared == actual, (declared, actual)
          assert d['state'] == 'ready_to_tag'
          assert d['tag_permitted'] is True
          assert d['release_permitted'] is False
          assert all(v == 'pass' for v in d['gates'].values())
          PY
      - name: Create authorized annotated tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(python -c "import json; print(json.load(open('evidence/independent-release-policy.json'))['candidate_tag'])")"
          COMMIT="$(python -c "import json; print(json.load(open('evidence/independent-release-policy.json'))['candidate_commit'])")"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            test "$EXISTING" = "$COMMIT"
            STATE="ALREADY_PRESENT_MATCH"
          else
            git config user.name 'stegverse-release-bot'
            git config user.email 'actions@users.noreply.github.com'
            git tag -a "$TAG" "$COMMIT" -m "StegCore $TAG — independent Governance policy authorized annotated tag only"
            git push origin "refs/tags/$TAG"
            STATE="CREATED"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Build activation receipt
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.tag.outputs.commit }}
          STATE: ${{ steps.tag.outputs.state }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          policy = json.load(open('evidence/independent-release-policy.json'))
          readiness = json.load(open('evidence/release-readiness.json'))
          out = {
            'schema_version': 'stegcore.release-tag-activation.v1',
            'status': 'PASS',
            'tag': os.environ['TAG'],
            'candidate_commit': os.environ['COMMIT'],
            'activation_state': os.environ['STATE'],
            'policy_decision_hash': policy['decision_hash'],
            'policy_source_commit': policy['source_commit'],
            'readiness_assessment_hash': readiness['assessment_hash'],
            'deployment_authorized': False,
            'continuity_receipt_minted': False
          }
          pathlib.Path('/tmp/release-tag-activation.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Upload activation receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-tag-activation
          path: /tmp/release-tag-activation.json
          if-no-files-found: error
