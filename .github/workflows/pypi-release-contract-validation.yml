name: PyPI Frozen Release Contract Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-pypi.yml'
      - '.github/workflows/pypi-release-contract-validation.yml'
      - 'tests/test_pypi_release_identity_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_pypi_release_identity_contract.py
