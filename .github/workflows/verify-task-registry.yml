name: verify-task-registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ecosystem_management/task_registry.yml
      - tools/assess_ecosystem_management_readiness.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/assess_ecosystem_management_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: task-registry-report
          path: brain_reports/stegverse_ecosystem_management_readiness_report.json
