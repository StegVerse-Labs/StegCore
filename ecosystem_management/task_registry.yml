version: 0.2
goal: ecosystem_managed_task_handoff_and_completion

assessment_rule: >-
  Continue building until the active task chain is complete or until task handoff,
  verification, next-task selection, and archive readiness can be handled by
  ecosystem management receipts.

required_management_capabilities:
  - mirror_handoff_present
  - machine_readable_task_registry_present
  - completion_criteria_declared
  - next_integration_candidate_declared
  - verification_command_declared
  - report_artifact_declared
  - parallel_session_non_overlap_declared
  - archive_readiness_declared

active_chain:
  org: StegVerse-Labs
  current_repo: stegfin-provider-banking
  current_status: self_bootstrapped_and_maturity_verifier_committed
  current_goal_activation: complete_when_bootstrap_and_verify_workflow_commits_report
  next_integration_candidate: stegfin-provider-acquisition-close
  parallel_session_overlap_status: no known overlapping session for provider-banking/acquisition-close chain

parallel_chains:
  - chain_id: rtg-tt-operational-layer
    owner_repo: StegCore
    status: building
    issue: StegVerse-Labs/StegCore#38
    handoff: docs/STEGVERSE_RTG_TT_OPERATIONAL_LAYER_HANDOFF.md
    state: ecosystem_management/rtg_tt_operational_layer.v0.1.json
    verification_command: python tools/verify_rtg_tt_operational_layer.py
    report_artifact: brain_reports/rtg_tt_operational_layer_report.json
    next_integration_candidate: StegVerse-Labs/Site#125
    downstream_candidates:
      - StegVerse-Labs/admissibility-wiki#51
      - StegVerse-002/stegguardian-wiki#10
      - GCAT-BCAT-Engine/Publisher#20
    non_overlap: does-not-claim-stegfin-chain-site-hil-paths-or-ae-tt-authority
    completion_criteria: verifier-green-site-main-verified-downstream-dependency-bound-activation-receipt-created

managed_repos:
  - name: stegfin-provider-token-ledger-executor
    status: management-capable
    handoff: live_execution/docs/STEGFIN_LIVE_TOKEN_LEDGER_EXECUTION_SHADOW_MIRROR_HANDOFF.md
    next_candidate: stegfin-provider-treasury-record
  - name: stegfin-provider-treasury-record
    status: management-capable
    handoff: docs/STEGFIN_PROVIDER_TREASURY_RECORD_MIRROR_HANDOFF.md
    next_candidate: stegfin-provider-banking
  - name: stegfin-provider-banking
    status: management-capable-pending-workflow-run
    handoff: docs/STEGFIN_PROVIDER_BANKING_MIRROR_HANDOFF.md
    next_candidate: stegfin-provider-acquisition-close
  - name: StegVA
    status: interim-handoff-recorded-pending-dedicated-repository
    handoff: docs/STEGVA_MIRROR_HANDOFF.md
    next_candidate: dedicated-stegva-repository-bootstrap
    ownership: stegva-nonprofit-formation-workstream
    non_overlap: does-not-claim-active-stegfin-provider-chain
    parallel_dependency: StegVerse-Labs/VAwatchdog
    parallel_boundary: StegVerse-Labs/VAwatchdog/docs/STEGVA_INTEGRATION_BOUNDARY.md
  - name: VAwatchdog
    status: management-capable-stegva-boundary-recorded
    handoff: docs/VAWATCHDOG_MIRROR_HANDOFF.md
    next_candidate: source-hardening-only-when-new-metadata-arrives
    ownership: vawatchdog-evidence-and-accountability-workstream
    non_overlap: does-not-own-stegva-private-claim-service
  - name: StegCore-RTG-TT
    status: building-operational-coordination-layer
    handoff: docs/STEGVERSE_RTG_TT_OPERATIONAL_LAYER_HANDOFF.md
    next_candidate: StegVerse-Labs/Site#125
    ownership: coordination-and-verification-only
    non_overlap: no-formalism-allocation-execution-custody-publication-or-release-authority

artifacts:
  management_report: brain_reports/stegverse_ecosystem_management_readiness_report.json
  stegva_interim_handoff: docs/STEGVA_MIRROR_HANDOFF.md
  stegva_vawatchdog_parallel_work_receipt: docs/STEGVA_VAWATCHDOG_PARALLEL_WORK_RECEIPT.md
  rtg_tt_operational_state: ecosystem_management/rtg_tt_operational_layer.v0.1.json
  rtg_tt_operational_report: brain_reports/rtg_tt_operational_layer_report.json
