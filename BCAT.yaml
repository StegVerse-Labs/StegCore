bcat_version: 1.0

module:
  name: StegCore
  type: service
  owner: StegVerse-Labs / StegCore Maintainers

authority:
  source: StegCore doctrine + resolver
  scope: Authority decisions for StegVerse actions
  renewal_required: true

trust_continuity:
  assumptions:
    - StegCore doctrine remains canonical and versioned
    - Authority checks are invoked before execution paths
    - Custody/accountability is recorded for actions
  continuity_signals:
    - Governance validation passes on PR/push
    - BCAT gate passes with explicit declaration present
    - No undocumented bypass paths introduced
  break_conditions:
    - Authority bypass introduced without StegCore reference
    - Non-action treated as failure in core paths
    - Uninspectable boundary conditions added

boundary_conditions:
  operational:
    - Authority evaluation required prior to mutation
    - Explainable deny/refuse path required
  temporal:
    - Changes must be reviewable via Git history
  contextual:
    - Any autonomy escalation requires explicit boundary update

degradation_behavior:
  modes: [constrain, suspend, refuse]
  explanation_required: true

human_accountability:
  custodian: StegCore maintainers
  escalation_path: GitHub issues + discussions in StegCore repo

non_action_policy:
  refusal_is_success: true
  explanation_required: true
