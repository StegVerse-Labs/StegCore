[project]
name = "stegcore"
version = "0.2.0"
description = "StegCore – constraint and governance layer for StegVerse"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
steggate = "stegcore.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stegcore*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
