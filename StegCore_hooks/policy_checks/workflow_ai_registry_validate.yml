name: Validate AI Registry (classes + mobility)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "ethics/**"
      - "registry/**"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python StegCore_hooks/policy_checks/validate_ai_registry.py
